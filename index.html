<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <meta name="theme-color" content="#020617" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tata Hidup Mu" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="description" content="Offline-first, privacy-focused productivity app with notes, tasks, calendar, finance tracking, and optional stateless AI assistance." />
    <meta property="og:title" content="Tata - Think. Act. Track. Advance." />
    <meta property="og:description" content="Offline-first, privacy-focused productivity app with notes, tasks, calendar, finance tracking, and optional stateless AI assistance." />
    <title>Tata - Think. Act. Track. Advance.</title>
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100dvh;
        background-color: #020617;
      }
      .tata-preloader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #020617;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        z-index: 9999;
      }
      .tata-preloader-logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background-color: #0f172a;
        border: 1px solid rgba(148, 163, 184, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .tata-preloader-spinner {
        width: 24px;
        height: 24px;
        border: 2px solid rgba(99, 102, 241, 0.25);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: tata-spin 0.8s linear infinite;
        margin-top: 14px;
      }
      @keyframes tata-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc;">
    <div id="root">
      <div class="tata-preloader">
        <div class="tata-preloader-logo">
          <img src="/icon.png" alt="Tata" width="48" height="48" style="border-radius: 12px; object-fit: cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.02em;">Tata Hidup Mu</div>
        <div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">Menyiapkan aplikasi offline...</div>
        <div class="tata-preloader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
